<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Send your photos & videos</title>
<meta name="description" content="Upload photos and videos and tell us how you'd like them edited.">
<meta name="theme-color" content="#d62976">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.1 5.9 5.9 2.1-5.9 2.1L12 18.5l-2.1-5.9L4 10.5l5.9-2.1z"/><path d="M18.5 15l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></svg></div>
    <span class="brand">Edit Studio</span>
  </div>
  <h1>Send your <span class="grad">photos &amp; videos</span></h1>
  <p class="sub">Add your files, tell us the vibe, and get a link to watch your edit come together.</p>

  <form class="card" id="form" novalidate>
    <div class="field">
      <label class="drop" id="drop" for="pick">
        <span class="ring"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></span>
        <span><strong>Add photos &amp; videos</strong><small>Tap to choose · select as many as you like</small></span>
      </label>
      <input id="pick" type="file" accept="image/*,video/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="field">
      <label for="prompt">What would you like done?</label>
      <textarea id="prompt" placeholder="e.g. Make Instagram stories with a warm look, or a 15-second reel with music and smooth transitions" maxlength="4000"></textarea>
    </div>

    <div class="field">
      <label for="name">Your name <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input type="text" id="name" maxlength="80" autocomplete="name">
    </div>

    <button class="btn" id="send" type="submit">Send</button>
    <div class="meter" id="meter" hidden>
      <div class="head"><span id="mlabel">Uploading…</span><b id="mpct">0%</b></div>
      <div class="track live"><i id="mfill"></i></div>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<script type="module">
import { upload } from "/blob-client.js";

const $ = (s) => document.querySelector(s);
const files = [];
const pick = $("#pick"), drop = $("#drop"), thumbs = $("#thumbs"), msg = $("#msg");
const PLAY = '<svg class="play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

function say(text, err = false) { msg.textContent = text; msg.className = "msg" + (err ? " err" : ""); }
function size(n) { return n > 1e9 ? (n / 1e9).toFixed(1) + " GB" : n > 1e6 ? Math.round(n / 1e6) + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB"; }

function add(list) {
  for (const file of list) {
    const isVid = file.type.startsWith("video/") || /\.(mov|mp4|m4v|webm|avi|mkv)$/i.test(file.name);
    const isImg = file.type.startsWith("image/") || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(file.name);
    if (!isVid && !isImg) { say(`"${file.name}" isn't a photo or video, so it was skipped.`, true); continue; }
    if (files.length >= 50) { say("You can send up to 50 files at once.", true); break; }
    const el = document.createElement("div"); el.className = "thumb";
    const url = URL.createObjectURL(file);
    let media;
    if (isVid) { media = document.createElement("video"); media.src = url + "#t=0.5"; media.muted = true; media.playsInline = true; media.preload = "metadata"; }
    else { media = document.createElement("img"); media.src = url; media.alt = ""; media.onerror = () => media.remove(); }
    el.append(media);
    if (isVid) el.insertAdjacentHTML("beforeend", PLAY);
    const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = size(file.size);
    const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "Remove " + file.name);
    const pct = document.createElement("div"); pct.className = "pct"; pct.hidden = true; pct.textContent = "0%";
    const bar = document.createElement("div"); bar.className = "bar"; bar.hidden = true; bar.append(document.createElement("i"));
    const item = { file, el, bar, pct, isVid };
    x.onclick = () => { files.splice(files.indexOf(item), 1); el.remove(); URL.revokeObjectURL(url); };
    el.append(badge, x, pct, bar); thumbs.append(el); files.push(item);
  }
  pick.value = "";
  if (files.length) say(`${files.length} file${files.length > 1 ? "s" : ""} ready`);
}
pick.addEventListener("change", () => add(pick.files));
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => add(e.dataTransfer.files));

function newId() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789", r = crypto.getRandomValues(new Uint8Array(12));
  return Array.from(r, (v) => a[v % a.length]).join("");
}
function safeName(n, i) {
  const m = n.match(/\.([A-Za-z0-9]{1,6})$/), ext = m ? "." + m[1].toLowerCase() : "";
  const stem = n.replace(/\.[^.]*$/, "").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60) || "file";
  return `${String(i + 1).padStart(2, "0")}_${stem}${ext}`;
}
function guessType(f, isVid) {
  if (f.type) return f.type;
  const e = (f.name.split(".").pop() || "").toLowerCase();
  return { mov: "video/quicktime", mp4: "video/mp4", m4v: "video/mp4", webm: "video/webm", heic: "image/heic", heif: "image/heif",
           jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png" }[e] || (isVid ? "video/mp4" : "image/jpeg");
}

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const prompt = $("#prompt").value.trim();
  if (!files.length) return say("Add at least one photo or video.", true);
  if (!prompt) { $("#prompt").focus(); return say("Tell us what you'd like done with your files.", true); }

  const send = $("#send"), fill = $("#mfill"), pctEl = $("#mpct");
  send.disabled = true; send.textContent = "Sending…"; $("#meter").hidden = false; say("Keep this page open until it reaches 100%.");
  document.querySelectorAll(".thumb .x").forEach((b) => (b.hidden = true));
  const id = newId(), total = files.reduce((s, f) => s + f.file.size, 0), done = new Map(), out = [];
  const tick = () => {
    const n = [...done.values()].reduce((a, b) => a + b, 0), p = Math.min(99, Math.floor((n / total) * 100));
    fill.style.width = p + "%"; pctEl.textContent = p + "%";
  };

  try {
    let next = 0;
    async function worker() {
      while (next < files.length) {
        const i = next++, it = files[i];
        it.bar.hidden = false; it.pct.hidden = false;
        const type = guessType(it.file, it.isVid);
        const blob = await upload(`requests/${id}/uploads/${safeName(it.file.name, i)}`, it.file, {
          access: "public", handleUploadUrl: "/api/upload", contentType: type,
          multipart: it.file.size > 20 * 1024 * 1024,
          onUploadProgress: ({ loaded, percentage }) => {
            done.set(i, loaded); it.bar.firstElementChild.style.width = percentage + "%"; it.pct.textContent = Math.floor(percentage) + "%"; tick();
          },
        });
        done.set(i, it.file.size); it.pct.textContent = "✓"; tick();
        out[i] = { url: blob.url, pathname: blob.pathname, name: it.file.name, type, size: it.file.size };
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    $("#mlabel").textContent = "Finishing…";
    const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, prompt, name: $("#name").value.trim(), files: out }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Couldn't send your request");
    fill.style.width = "100%"; pctEl.textContent = "100%"; $("#mlabel").textContent = "Sent!";
    try { const k = "myRequests", l = JSON.parse(localStorage.getItem(k) || "[]"); l.unshift(id); localStorage.setItem(k, JSON.stringify(l.slice(0, 20))); } catch {}
    setTimeout(() => (location.href = `/r/${id}?new=1`), 500);
  } catch (err) {
    say((err && err.message ? err.message : "Upload failed") + ". Check your connection and try again.", true);
    send.disabled = false; send.textContent = "Try again";
  }
});
</script>
</body>
</html>
